<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027 루틴 기록지 · 루아핏</title>
<meta property="og:title" content="2027 루틴 기록지 · 루아핏">
<meta property="og:description" content="2026 돌아보기 + 2027 계획, 무료 기록지 두 장">
<meta property="og:image" content="https://luafit.kr/2027/banner.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;700&family=Gaegu:wght@700&display=swap">
<style>
:root{--olive:#3F4A35;--deep:#2A3123;--butter:#F4E890;--ivory:#F3F1E9;--muted:#6f7466}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--deep);font-family:"Noto Sans KR",sans-serif;line-height:1.6;word-break:keep-all}
header{background:var(--olive);color:var(--ivory);padding:22px 18px 26px;text-align:center}
header a{color:var(--butter);text-decoration:none;font-weight:700;letter-spacing:.08em;font-size:13px}
header .hand{font-family:Gaegu,cursive;color:var(--butter);font-size:20px;margin-top:10px}
header h1{font-family:"Gowun Batang",serif;font-size:28px;margin:2px 0 4px}
header p{margin:0;font-size:14px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.how{background:#fff;border-left:4px solid var(--olive);padding:12px 14px;font-size:14px;margin-bottom:18px}
.how b{color:var(--olive)}
figure{margin:0 0 22px}
figure img{width:100%;display:block;border:1px solid #d6d3c4;background:#fff}
figcaption{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.btn{display:block;text-align:center;background:var(--olive);color:var(--ivory);text-decoration:none;font-weight:700;padding:14px;font-size:16px}
.btn.alt{background:var(--butter);color:var(--deep);margin-top:10px}
.flash{outline:3px solid var(--butter);outline-offset:3px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:20px}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <a href="https://luafit.kr/">LUAFIT</a>
  <div class="hand">루아쌤의 무료 기록지</div>
  <h1>2027 루틴 기록지</h1>
  <p>2026 돌아보기 + 2027 계획, 두 장</p>
</header>
<main>
  <div class="how"><b>폰에 저장하기</b> 아래 사진을 <b>꾹 눌러 저장</b>하세요. 노트 앱(노트+·굿노트 등)에서 불러와 바로 쓸 수 있어요.</div>

  <figure><img src="luafit-2027-1.jpg" alt="2026 돌아보기 기록지"><figcaption>1장 · 2026, 나는 이렇게 살았다</figcaption></figure>
  <figure><img src="luafit-2027-2.jpg" alt="2027 계획 기록지"><figcaption>2장 · 2027, 루틴으로 바꾸는 한 해</figcaption></figure>

  <a class="btn" id="pdf" href="/files/luafit-2027-routine.pdf" download="luafit-2027-routine.pdf">출력용 PDF 다운로드</a>
  <p class="note" id="pdfnote">아이폰은 "다운로드" 확인 창이 뜨면 눌러 주세요. 파일 앱의 다운로드 폴더에 저장돼요.</p>

  <a class="btn alt" href="https://luafit.kr/#program">루틴으로 2027을 바꾸고 싶다면 · 루틴성형 함께하기 →</a>
</main>
<footer>luafit.kr · <a href="https://www.instagram.com/luafit_healthylife/">@luafit_healthylife</a> · 만든이 루아쌤</footer>
<script>
(function(){
  var ua=navigator.userAgent||'', btn=document.getElementById('pdf'), note=document.getElementById('pdfnote');
  var kakao=/KAKAOTALK/i.test(ua), insta=/Instagram|FBAN|FBAV/i.test(ua);
  if(kakao){
    note.textContent='카톡 안에서는 다운로드가 막혀 있어요. 버튼을 누르면 Safari(또는 기본 브라우저)로 열려요. 거기서 한 번 더 눌러 주세요.';
    btn.addEventListener('click',function(e){
      e.preventDefault();
      location.href='kakaotalk://web/openExternal?url='+encodeURIComponent('https://luafit.kr/2027/#pdf');
    });
  } else if(insta){
    note.textContent='인스타 안에서는 다운로드가 막혀 있어요. 오른쪽 위 ⋯ → "외부 브라우저에서 열기"를 누른 뒤 다시 눌러 주세요.';
  }
  if(location.hash==='#pdf'){btn.scrollIntoView({block:'center'});btn.classList.add('flash')}
})();
</script>
</body>
</html>
