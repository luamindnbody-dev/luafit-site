<script>
/* Local storage layer: every record and photo stays in this browser only (IndexedDB). Same API shape the app already uses. */
const LOCAL=(()=>{
  const DBN="luafit-lessonnote-v1",ST="docs",BS="blobs";
  let idb=null;const cache={},blobs={};let listeners=[];
  const openDb=()=>new Promise((res,rej)=>{let r;try{r=indexedDB.open(DBN,1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST);if(!d.objectStoreNames.contains(BS))d.createObjectStore(BS)};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const run=(store,mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction(store,mode);fn(t.objectStore(store));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("aborted"))});
  const ready=(async()=>{idb=await openDb();
    await new Promise((res,rej)=>{const t=idb.transaction([ST,BS]);
      const a=t.objectStore(ST).openCursor();a.onsuccess=()=>{const c=a.result;if(c){cache[c.key]=c.value;c.continue()}};
      const b=t.objectStore(BS).openCursor();b.onsuccess=()=>{const c=b.result;if(c){blobs[c.key]=URL.createObjectURL(c.value);c.continue()}};
      t.oncomplete=res;t.onerror=()=>rej(t.error)});
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  })();
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  const fix=v=>{if(Array.isArray(v))return v.map(fix);if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=fix(v[k]);const id=o.assetId||o.id;if(typeof o.url==="string"&&id&&blobs[id])o.url=blobs[id];return o}return v};
  const depth=p=>p.split("/").length;
  const snapDoc=path=>{const d=cache[path];return{id:path.split("/").pop(),exists:d!==undefined,data:()=>d===undefined?undefined:fix(clone(d))}};
  const snapCol=col=>{const docs=Object.keys(cache).filter(k=>k.startsWith(col+"/")&&depth(k)===depth(col)+1).map(k=>({id:k.split("/").pop(),exists:true,data:()=>fix(clone(cache[k]))}));return{docs,size:docs.length,empty:!docs.length}};
  const notify=path=>listeners.slice().forEach(l=>{const hit=l.doc?l.path===path:(path.startsWith(l.path+"/")&&depth(path)===depth(l.path)+1);if(hit){try{l.cb(l.doc?snapDoc(l.path):snapCol(l.path))}catch(e){console.error(e)}}});
  const notifyAll=()=>listeners.slice().forEach(l=>{try{l.cb(l.doc?snapDoc(l.path):snapCol(l.path))}catch(e){console.error(e)}});
  async function write(path,val){await ready;
    try{if(val===undefined){await run(ST,"readwrite",s=>s.delete(path));delete cache[path]}else{await run(ST,"readwrite",s=>s.put(val,path));cache[path]=val}}
    catch(e){if(e&&e.name==="QuotaExceededError")alertFull();throw e}
    notify(path)}
  function patchObj(o,p){for(const k in p){const v=p[k],ks=k.split(".");let cur=o;for(let i=0;i<ks.length-1;i++){if(!cur[ks[i]]||typeof cur[ks[i]]!=="object")cur[ks[i]]={};cur=cur[ks[i]]}
    const last=ks[ks.length-1];if(v&&typeof v==="object"&&v.__delete__===true)delete cur[last];else cur[last]=clone(v)}return o}
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function docRef(path){return{id:path.split("/").pop(),path,
    set:async v=>write(path,clone(v)),
    update:async v=>{await ready;if(cache[path]===undefined){const e=new Error("not found");e.code="not_found";throw e}return write(path,patchObj(clone(cache[path]),v))},
    delete:async()=>write(path,undefined),
    get:async()=>{await ready;return snapDoc(path)},
    onSnapshot:(cb,err)=>{const l={doc:true,path,cb};listeners.push(l);ready.then(()=>cb(snapDoc(path))).catch(e=>err&&err(e));return()=>{listeners=listeners.filter(x=>x!==l)}}}}
  function colRef(col){return{path:col,
    doc:id=>docRef(col+"/"+(id||uid())),
    get:async()=>{await ready;return snapCol(col)},
    onSnapshot:(cb,err)=>{const l={doc:false,path:col,cb};listeners.push(l);ready.then(()=>cb(snapCol(col))).catch(e=>err&&err(e));return()=>{listeners=listeners.filter(x=>x!==l)}}}}
  const db={doc:docRef,collection:colRef};
  function shrink(file){return new Promise(res=>{if(!file.type||!file.type.startsWith("image/")||file.type==="image/png"&&file.size<400000){res(file);return}
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const s=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",.72)};
    img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}
  const assets={
    upload:async file=>{await ready;const b=await shrink(file);const id="a"+uid();
      try{await run(BS,"readwrite",s=>s.put(b,id))}catch(e){if(e&&e.name==="QuotaExceededError")alertFull();throw e}
      blobs[id]=URL.createObjectURL(b);return{id,url:blobs[id],sizeBytes:b.size,contentType:b.type}},
    delete:async id=>{await ready;await run(BS,"readwrite",s=>s.delete(id));if(blobs[id]){URL.revokeObjectURL(blobs[id]);delete blobs[id]}},
    list:async()=>({assets:Object.keys(blobs).map(id=>({id,url:blobs[id]})),usage:{}})};
  function alertFull(){try{const e=document.createElement("div");e.className="toast";e.textContent="이 기기의 저장 공간이 꽉 찼어요. 오래된 자세 사진을 지워 주세요";document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}catch(_){}}
  async function use(name){
    if(name==="db"){try{await ready;return db}catch(e){return null}}
    if(name==="assets"){try{await ready;return assets}catch(e){return null}}
    if(name==="downloads"){try{return window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){return null}}
    return null}
  /* backup */
  const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s)));
  async function backupCode(){await ready;return "LUAFITNOTE:"+enc(JSON.stringify({v:1,at:new Date().toISOString(),docs:cache}))}
  async function restore(code){const raw=(code||"").trim();if(!raw.startsWith("LUAFITNOTE:"))throw new Error("format");
    const o=JSON.parse(dec(raw.slice(11)));if(!o||typeof o.docs!=="object")throw new Error("format");await ready;
    await run(ST,"readwrite",s=>{s.clear();for(const k in o.docs)s.put(o.docs[k],k)});
    for(const k in cache)delete cache[k];Object.assign(cache,o.docs);notifyAll();return Object.keys(o.docs).filter(k=>k.startsWith("teams/")).length}
  document.addEventListener("click",async e=>{const b=e.target.closest&&e.target.closest("[data-lbk]");if(!b)return;
    const ta=document.getElementById("lbk-in");const say=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};
    if(b.dataset.lbk==="copy"){const code=await backupCode();try{await navigator.clipboard.writeText(code);say("백업 코드를 복사했어요. 카톡 나에게 보내기나 메모장에 붙여 두세요")}catch(_){if(ta){ta.value=code;ta.select()}say("복사가 안 돼서 아래 칸에 넣었어요. 길게 눌러 전체 복사해 주세요")}return}
    if(b.dataset.lbk==="load"){if(!ta||!ta.value.trim()){say("백업 코드를 먼저 붙여 넣어 주세요");return}
      if(!b.dataset.armed){b.dataset.armed="1";const o=b.textContent;b.textContent="한 번 더 누르면 지금 기록이 백업으로 바뀌어요";setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=o}},3500);return}
      delete b.dataset.armed;try{const n=await restore(ta.value);say(`불러왔어요 · 회원 ${n}팀`);ta.value=""}catch(_){say("백업 코드를 읽지 못했어요. 복사한 코드 전체를 붙여 넣어 주세요")}}});
  return{use}})();

</script>
<script>
let TIMES=[],WORKDAYS=[1,2,3,4,5,6],LESSON=50;let HOURS=[];const INSTA="https://www.instagram.com/luafit_healthylife/";
const DAYSETS={mw:[1,3],tt:[2,4]};
const daysArr=d=>Array.isArray(d)?d:(DAYSETS[d]||[]);
const dayLabel=d=>daysArr(d).slice().sort().map(w=>"일월화수목금토"[w]).join("·")||"요일 없음";
const roomsOn=()=>(settings.rooms||0)>0;
const roomTxt=d=>roomsOn()?` · ${roomOf(d)}번방`:"";
function applySettings(){HOURS=Array.from({length:19},(_,i)=>pad(i+5)+":00");LESSON=+settings.lessonMin||50;WORKDAYS=(settings.workdays&&settings.workdays.length?settings.workdays:[1,2,3,4,5,6]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
  const st=[];for(let h=5;h<=23;h++){st.push(pad(h)+":00");st.push(pad(h)+":30")}TIMES=st.filter(x=>tmin(x)>=tmin(settings.dayStart||"09:00")&&tmin(x)+LESSON<=Math.max(tmin(settings.dayEnd||"22:00"),tmin(settings.dayStart||"09:00")+LESSON));
  document.documentElement.style.setProperty("--nd",WORKDAYS.length);document.documentElement.style.setProperty("--mr","0px")}
const DAYNAME=["일","월","화","수","목","금","토"];
let PER=8, MAXM=99;
let db=null, assets=null, teams={}, sessions=[], tab="s", weekStart=null, loaded={t:false,s:false}, settings={lessonMin:50,dayStart:"09:00",dayEnd:"22:00",rooms:0};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<em>$1</em>");
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const tmin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=t=>t.replace(":","").padStart(4,"0");
const todayS=()=>ds(new Date());
const nice=s=>{const d=pd(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DAYNAME[d.getDay()]+")"};
const short=s=>{const d=pd(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+DAYNAME[d.getDay()]+")"};
const given=n=>n.length===3?n.slice(1):n;
const teamShort=t=>t.members.map(given).join("·");
const teamFull=t=>t.members.join(" · ");
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function mondayOf(s){const d=pd(s);let w=d.getDay();if((w===0&&!WORKDAYS.includes(0))||(w===6&&!WORKDAYS.includes(6)&&!WORKDAYS.includes(0))){d.setDate(d.getDate()+(w===6?2:1))}else d.setDate(d.getDate()-((w+6)%7));return ds(d)}
weekStart=mondayOf(todayS());

/* ---------- schedule engine (수강권 차감 방식) ---------- */
const STATUS={scheduled:"예정",done:"진행",cancel:"취소",deduct:"차감",moved:"변경"};
function slotOn(team,d){const h=(team.daysHist||[]).filter(x=>d<=x.until).sort((a,b)=>a.until<b.until?-1:1)[0];return h?{days:h.days,time:h.time||team.time}:{days:team.days,time:team.time}}
const endT=t=>{const m=tmin(t)+LESSON;return Math.floor(m/60)+":"+pad(m%60)};
const passesOf=t=>(t.passes||[]).slice().sort((a,b)=>(a.start||"")<(b.start||"")?-1:1);
function effStatus(e){return e.status==="scheduled"&&e.date<=todayS()?"done":e.status}
function teamEvents(team, until){
  const docs=sessions.filter(s=>s.teamId===team.id);const byKey={};docs.forEach(d=>byKey[d.date+"_"+d.time]=d);
  const ev=[];
  if(daysArr(team.days).length||(team.daysHist||[]).length){let d=team.startDate||todayS();const end=team.status==="ended"&&team.endDate?team.endDate:until;
    while(d<=end){const w=pd(d).getDay();const so=slotOn(team,d);
      if(so.time&&daysArr(so.days).includes(w)){const doc=byKey[d+"_"+so.time];ev.push({team,date:d,time:so.time,kind:"regular",status:doc?doc.status||"scheduled":"scheduled",doc})}
      d=addD(d,1);}}
  docs.filter(x=>x.kind==="extra").forEach(x=>ev.push({team,date:x.date,time:x.time,kind:"extra",status:x.status||"scheduled",doc:x}));
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:tmin(a.time)-tmin(b.time));
  const ps=passesOf(team);let pi=0,k=0,n=0;
  ev.forEach(e=>{e.ym=e.date.slice(0,7);const s=effStatus(e);if(s==="cancel"||s==="moved")return;
    n++;e.n=n;
    while(pi<ps.length&&k>=(ps[pi].total||0)){pi++;k=0}
    if(pi<ps.length){k++;e.month=pi+1;e.inMonth=k;e.total=ps[pi].total;e.pass=ps[pi]}else{e.over=true;e.month=ps.length+1;e.inMonth=0;e.total=0}});
  return ev;
}
let cache=null;
function allEvents(){if(cache)return cache;const until=addD([weekStart,todayS(),monthYm+"-28"].sort().pop(),70);cache=Object.values(teams).flatMap(t=>teamEvents(t,until));return cache}
function invalidate(){cache=null}
function teamProgress(t){const evs=allEvents().filter(e=>e.team.id===t.id&&e.n);const td=todayS();
  const used=evs.filter(e=>e.date<=td).length,reserved=evs.filter(e=>e.date>td).length;const total=passesOf(t).reduce((s,p)=>s+(+p.total||0),0);
  const last=evs.filter(e=>e.date<=td).pop();const cur=last&&!last.over?last:evs.find(e=>!e.over&&e.date>td)||last;
  return {k:used,used,reserved,total,remain:total-used,month:cur?cur.month:1,inMonth:last&&!last.over?last.inMonth:0,curTotal:cur?cur.total:0}}
function makeupLedger(){return[]}
function nextAfter(ev){return allEvents().filter(e=>e.team.id===ev.team.id&&e.n&&(e.date>ev.date||(e.date===ev.date&&tmin(e.time)>tmin(ev.time))))[0]||null}
function conflicts(date,time,exceptKey){const a=tmin(time),b=a+LESSON;return allEvents().filter(e=>e.date===date&&e.n!==undefined&&!(effStatus(e)==="cancel"||effStatus(e)==="moved")&&(e.team.id+"|"+e.time)!==exceptKey&&tmin(e.time)<b&&tmin(e.time)+LESSON>a)}
const passLabel=e=>e.over?"수강권 없음":e.total?`${e.inMonth}/${e.total}회`:"";

/* ---------- db ---------- */
async function save(id,data){try{await db.doc("sessions/"+id).set(data)}catch(e){toast("저장하지 못했어요. 잠시 후 다시 눌러주세요.");throw e}}
async function delSession(id){try{await db.doc("sessions/"+id).delete()}catch(e){toast("삭제하지 못했어요.")}}
const sid=(date,time,teamId)=>date+"_"+hhmm(time)+"_"+teamId;
function docData(d){const {id,...rest}=d;return rest}

/* ---------- render: schedule ---------- */
function renderWeek(){
  const wd=WORKDAYS.map(w=>addD(weekStart,(w+6)%7));const end=wd[wd.length-1];
  const s=pd(weekStart);const label=tab==="m"?(+monthYm.slice(0,4))+"년 "+(+monthYm.slice(5))+"월":(s.getMonth()+1)+"/"+s.getDate()+" – "+short(end).replace(/\(.+\)/,"");
  $("#wk").innerHTML=`<button id="prev" aria-label="이전 ${tab==="m"?"달":"주"}">‹</button><span>${label}</span><button id="next" aria-label="다음 ${tab==="m"?"달":"주"}">›</button>`;
}
const ROWH=26;
function renderSchedule(){
  const wd=WORKDAYS.map(w=>addD(weekStart,(w+6)%7));const today=todayS();

/* ---------- flow card (monthly summary) ---------- */
let fedit=null;
function teamMonths(t){const evs=allEvents().filter(e=>e.team.id===t.id&&e.n&&e.date<=addD(todayS(),31));const ms=[...new Set(evs.filter(e=>!e.over).map(e=>e.month))];return ms.length?ms:[teamProgress(t).month]}
function monthData(t,m){
  const evs=allEvents().filter(e=>e.team.id===t.id);
  const inM=evs.filter(e=>e.n&&e.month===m);
  const nextFirst=evs.find(e=>e.n&&e.month===m+1);
  const from=inM[0]?inM[0].date:null,to=nextFirst?nextFirst.date:"9999";
  const absents=from?evs.filter(e=>effStatus(e)==="cancel"&&e.date>=from&&e.date<to):[];
  const done=inM.filter(e=>e.date<=todayS());
  const recs=inM.filter(e=>e.doc&&e.doc.record).map(e=>({e,r:e.doc.record}));
  const cnt=new Map();recs.forEach(({r})=>(r.exercises||"").split("\n").map(s=>s.replace(/\*\*/g,"").trim()).filter(Boolean).forEach(x=>cnt.set(x,(cnt.get(x)||0)+1)));
  const moves=[...cnt.entries()].sort((a,b)=>b[1]-a[1]);
  const hws=[...new Set(recs.map(({r})=>(r.hwTitle||"").replace(/\*\*/g,"").trim()).filter(Boolean))];
  return {inM,done,absents,makeups:inM.filter(e=>e.kind==="makeup"),recs,moves,hws,from,last:inM[inM.length-1]};
}
function openFlow(tid,m){const t=teams[tid];const ms=teamMonths(t);m=m||teamProgress(t).month;if(!ms.includes(m))m=ms[ms.length-1];
  const saved=((t.monthNotes||{})[m])||{};fedit={tid,m,notes:{members:{...(saved.members||{})},memo:saved.memo??"한 달 동안 정말 수고 많으셨어요 :)"}};drawFlow();}

   <p class="muted" style="margin:8px 0 0">${d.from?`${short(d.from)}부터 · 수업 ${d.done.length}회 진행 · 기록 ${d.recs.length}개`:"아직 이 달 수업이 없어요"}</p></div>

  <div class="field"><span class="lab">회원별 한 달 피드백 <span class="hint">좋아진 점, 다음 달 신경 쓸 점</span></span><div class="stack">${t.members.map((mm,i)=>`<label for="fl-${i}" style="margin:4px 0 0;font-weight:700;color:var(--olive-ink)">${esc(mm)}${t.habits&&t.habits[mm]?` <span class="hint">고칠 습관: ${esc(t.habits[mm])}</span>`:""}</label><textarea id="fl-${i}" data-fmem="${esc(mm)}" placeholder="처음엔 **호흡이 짧았는데** 이제 동작 내내 유지돼요.&#10;다음 달엔 어깨 내리기에 집중해요.">${esc(fedit.notes.members[mm]||"")}</textarea>`).join("")}</div></div>

    const nt=tb.dataset.mkt,nk=kb?kb.dataset.mkk:s.kind;const nid=sid(s.date,s.time,nt);const data={...docData(s),teamId:nt,kind:nk};
    try{if(nid!==s.id){await db.doc("sessions/"+nid).set(data);await db.doc("sessions/"+s.id).delete()}else await db.doc("sessions/"+s.id).set(data);closeLayer();toast("바꿨어요")}catch(e){toast("저장하지 못했어요")}return}
  if(a==="cardcopy"){try{await navigator.clipboard.writeText(window.__cardText||"");toast("복사했어요. 카톡에 붙여넣으세요")}catch(e){toast("복사가 안 돼요. 카드를 캡처해 주세요")}return}
  if(a==="addowed"){const ym=$("#ow-m").value,note=$("#ow-note").value.trim();try{await db.doc("sessions/owed_"+ym.replace("-","")+"_"+tedit.id+"_"+Date.now().toString(36)).set({teamId:tedit.id,kind:"owed",date:ym+"-01",time:"0:00",status:"absent",note});toast("밀린 수업 1회를 추가했어요");setTimeout(()=>openTeam(tedit.id),400)}catch(e){toast("저장하지 못했어요")}return}

  if(a==="noticecopy"){nedit.memo=$("#nt-memo").value;const t=teams[nedit.tid];const txt=noticeText(t,nedit.ym,monthEvents(t,nedit.ym));try{await navigator.clipboard.writeText(txt);toast("복사했어요. 카톡에 붙여넣으세요")}catch(e){toast("복사가 안 돼요. 카드를 캡처해 주세요")}return}
  if(a==="saveroom"){const n=+$("#rm").value;try{await db.doc("settings/main").set({...settings,roomWeek:mondayOf(todayS()),roomNo:n});toast("저장했어요")}catch(e){toast("저장하지 못했어요")}return}

  if(a==="discarddraft"){clearTimeout(draftTimer);draftTimer=null;const e=edit.e;try{const s=sessions.find(x=>x.id===edit.id);if(s){const {draft,draftAt,...rest}=s;await db.doc("sessions/"+edit.id).set(rest)}}catch(e){}toast("저장된 내용으로 되돌렸어요");setTimeout(()=>openEditor(e.date,e.time,e.team.id),400);return}
  if(a==="flow"){openFlow(tedit.id);return}
  if(a==="flowback"){openTeam(fedit.tid);return}
  if(a==="saveflow"){try{await saveFlow()}catch(e){}return}
  if(a==="flowcard"){try{await saveFlow();flowCard()}catch(e){}return}
  if(a==="flowedit"){drawFlow();return}
  if(a==="savecycle"){const v=$("#cyc").value;if(!/^\d{4}-\d{2}$/.test(v)){toast("시작 달을 골라주세요");return}try{await db.doc("settings/main").set({cycleStart:v});toast("저장했어요")}catch(e){toast("저장하지 못했어요")}return}
  if(a==="endteam"){await saveTeam({status:"ended",endDate:todayS()});return}
  if(a==="reopen"){tedit.endDate=undefined;await saveTeam({status:"active"});return}
});
function pzClamp(){const v=$("#pzvp");if(!v)return;const r=v.getBoundingClientRect();pzZ.s=Math.min(5,Math.max(1,pzZ.s));pzZ.x=Math.min(0,Math.max(r.width-r.width*pzZ.s,pzZ.x));pzZ.y=Math.min(0,Math.max(r.height-r.height*pzZ.s,pzZ.y))}
function pzApply(){const b=document.querySelector(".pzbig");if(b)b.style.transform=`translate(${pzZ.x}px,${pzZ.y}px) scale(${pzZ.s})`}
let pzPtr=new Map(),pzG=null;
document.addEventListener("pointerdown",ev=>{const v=ev.target.closest&&ev.target.closest("#pzvp");if(!v||(!pzZoom&&!pzEdit))return;if(ev.pointerType==="pen")return;if(ev.isPrimary){pzPtr.clear();pzG=null}pzPtr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  const r=v.getBoundingClientRect();
  if(pzPtr.size===2){const [a,b]=[...pzPtr.values()];pzDrag=null;pzG={mode:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,c0:{x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top},z0:{...pzZ}}}
  else if(pzPtr.size===1&&pzZoom)pzG={mode:"pan",x0:ev.clientX,y0:ev.clientY,z0:{...pzZ},moved:false}});
document.addEventListener("pointermove",ev=>{if(!pzPtr.has(ev.pointerId)||!pzG)return;pzPtr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});const v=$("#pzvp");if(!v)return;const r=v.getBoundingClientRect();
  if(pzG.mode==="pinch"&&pzPtr.size>=2){ev.preventDefault();const [a,b]=[...pzPtr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1,c={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top},z=pzG.z0;const s=Math.min(5,Math.max(1,z.s*d/pzG.d0));const ux=(pzG.c0.x-z.x)/z.s,uy=(pzG.c0.y-z.y)/z.s;pzZ={s,x:c.x-ux*s,y:c.y-uy*s};pzClamp();pzApply();pzDragAt=performance.now()}
  else if(pzG.mode==="pan"&&pzPtr.size===1){const dx=ev.clientX-pzG.x0,dy=ev.clientY-pzG.y0;if(!pzG.moved&&Math.hypot(dx,dy)<4)return;pzG.moved=true;ev.preventDefault();pzZ={s:pzG.z0.s,x:pzG.z0.x+dx,y:pzG.z0.y+dy};pzClamp();pzApply()}});
const pzEnd=ev=>{if(!pzPtr.has(ev.pointerId))return;pzPtr.delete(ev.pointerId);if(pzG&&pzG.mode==="pinch"){pzDragAt=performance.now();const lab=document.querySelector(".pzbar2 .muted");if(lab&&lab.textContent.startsWith("확대"))lab.textContent="확대 "+pzZ.s.toFixed(1)+"배";if(pzZ.s>1&&!document.querySelector('[data-act=pzzoom]'))openPz(pzCur)}if(!pzPtr.size)pzG=null;else if(pzPtr.size===1&&pzZoom){const [p1]=[...pzPtr.values()];pzG={mode:"pan",x0:p1.x,y0:p1.y,z0:{...pzZ},moved:true}}};
document.addEventListener("pointerup",pzEnd);document.addEventListener("pointercancel",pzEnd);
let pzDrag=null,pzDragAt=-1e9;
function tiltLabel(p){const a=pzMode==="hline"?(p.ha||0):(p.va||0);return `${pzMode==="hline"?"가로선":"세로선"} 기울기 ${Math.abs(a).toFixed(1)}°${a? (pzMode==="hline"?(a>0?" (오른쪽 내려감)":" (왼쪽 내려감)"):(a>0?" (위가 왼쪽)":" (위가 오른쪽)")):""}`}
document.addEventListener("pointerdown",ev=>{const box=ev.target.closest("[data-pztap]");if(!box||!pzEdit||(pzMode!=="line"&&pzMode!=="hline"))return;const p=postures.find(x=>x.id===box.dataset.pid);if(!p)return;
  if(pzMode==="hline"&&p.hy==null)return;pzDrag={box,p,x0:ev.clientX,y0:ev.clientY,moved:false,snap:pzSnap(p)};});
document.addEventListener("pointermove",ev=>{if(!pzDrag)return;const {box,p}=pzDrag;if(!pzDrag.moved&&Math.hypot(ev.clientX-pzDrag.x0,ev.clientY-pzDrag.y0)<10)return;pzDrag.moved=true;ev.preventDefault();
  const r=box.getBoundingClientRect();let px,py;if(pzMode==="hline"){px=(p.hx??.5)*r.width;py=p.hy*r.height}else{px=(p.cx??.5)*r.width;py=(p.vy??.5)*r.height}
  const dx=ev.clientX-r.left-px,dy=ev.clientY-r.top-py;if(Math.hypot(dx,dy)<15)return;
  let a;if(pzMode==="hline"){a=Math.atan2(dy,dx)*180/Math.PI;if(a>90)a-=180;if(a<-90)a+=180;p.ha=Math.round(a*10)/10}else{a=Math.atan2(dx,dy)*180/Math.PI;if(a>90)a-=180;if(a<-90)a+=180;p.va=-Math.round(a*10)/10}
  attachGrids(box.parentElement);const lb=$("#tiltlab");if(lb)lb.textContent=tiltLabel(p);},{passive:false});
document.addEventListener("dragstart",ev=>{if(ev.target.closest&&ev.target.closest(".pz"))ev.preventDefault()});
document.addEventListener("pointercancel",()=>{pzDrag=null});
document.addEventListener("pointerup",async ev=>{if(!pzDrag)return;const d=pzDrag;pzDrag=null;if(!d.moved)return;pzDragAt=performance.now();pzHist.push(d.snap);if(pzHist.length>30)pzHist.shift();pzUndoBtn();
  const u=pzMode==="hline"?{ha:d.p.ha||0}:{va:d.p.va||0};try{await db.doc("postures/"+d.p.id).update(u)}catch(e){toast("기울기를 저장하지 못했어요")}});
document.addEventListener("click",async ev=>{const box=ev.target.closest("[data-pztap]");if(box&&!pzEdit&&!pzZoom){toast("아래 '그리기'를 누른 뒤 점이나 선을 놓을 수 있어요");return}if(!box||!pzEdit)return;if(performance.now()-pzDragAt<350)return;const r=box.getBoundingClientRect();const cx=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),cy=Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height));const p=postures.find(x=>x.id===box.dataset.pid);if(!p)return;let upd;if(pzMode==="mark"){const ms=[...(p.marks||[])];const ar=r.height/r.width;const hit=ms.findIndex(m=>Math.hypot(m.x-cx,(m.y-cy)*ar)<0.03);if(hit>=0)ms.splice(hit,1);else ms.push({x:+cx.toFixed(4),y:+cy.toFixed(4)});upd={marks:ms}}else upd=pzMode==="grid"?{gx:cx,gy:cy}:pzMode==="hline"?{hy:cy,hx:cx}:{cx,vy:cy};pzPush(p);Object.assign(p,upd);pzUndoBtn();attachGrids(box.parentElement);if(pzMode!=="line"&&$("#pzhint"))setTimeout(()=>{if(pzCur===p.id&&document.querySelector("[data-pzmode]"))openPz(p.id)},50);try{await db.doc("postures/"+p.id).update(upd)}catch(e){toast("위치를 저장하지 못했어요")}});
