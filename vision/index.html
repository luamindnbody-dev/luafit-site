<style>
:root{--bg:#F3F1E9;--card:#FFFFFF;--ink:#36412B;--muted:#6F7466;--line:#DEDACB;--soft:#E9E6D8;--olive:#6F7F5E;--butter:#F4E890;--mist:#DCE3C9;--alert:#B5563A;color-scheme:light;
  --f-title:"Gowun Batang",serif;--f-body:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--f-hand:"Gaegu",cursive}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;word-break:keep-all;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--olive);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.top .hand a.home{color:inherit;text-decoration:none;display:inline-block;padding:6px 10px;margin:-6px 0 -6px -10px}
.top .hand{font-family:var(--f-hand);font-size:18px;color:var(--olive);margin:0}

nav.tabs{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
nav.tabs button{border:1.5px solid var(--olive);background:transparent;color:var(--olive);border-radius:99px;padding:7px 0;font-size:clamp(11px,3.1vw,13.5px);font-weight:700;white-space:nowrap;letter-spacing:-.4px}
nav.tabs button[aria-current="page"]{background:var(--olive);color:var(--butter)}

.btn.y{background:var(--butter);color:var(--ink)}

.vc{flex:0 0 78%;max-width:340px;scroll-snap-align:start;background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;aspect-ratio:4/5;background:var(--mist);color:var(--olive);font-size:13.5px;font-weight:700;cursor:pointer;overflow:hidden}

@media (prefers-reduced-motion:reduce){.fi{transition:none}}
.shw{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}

.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shh b{font-family:var(--f-title);font-size:18px;color:var(--olive)}
.pvw{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.pv{position:relative;width:46%;max-width:200px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;flex:none;touch-action:none;-webkit-user-select:none;user-select:none}
.pv[data-drag]{cursor:grab}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pvb{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pick{margin-top:8px;font-size:12px;color:var(--muted)}
.pick>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.pick button{border:1.5px dashed var(--olive);background:transparent;color:var(--olive);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700}
.shr{font-size:11px;font-weight:700;color:var(--olive);background:var(--mist);border-radius:8px;padding:1px 6px;flex:none}
.ft{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ft.lift{opacity:.35}
.ft.hot .fi{box-shadow:0 0 0 3px var(--olive);border-radius:12px}
.ghost{position:fixed;z-index:70;pointer-events:none;width:72px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--mist);box-shadow:0 8px 20px rgba(0,0,0,.25);transform:translate(-50%,-60%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--olive);text-align:center;padding:4px}
.ghost img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:700}
.cats button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--butter)}
.szr{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);flex:1;min-width:150px;max-width:240px}
.szr input{flex:1;accent-color:var(--olive)}
.szr:focus-within{outline:none}
.gt{border:0;background:var(--card);border-radius:12px;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-width:0}
.gt.gd{box-shadow:inset 0 0 0 2px var(--butter)}
.gp{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;background:var(--mist);color:var(--olive);font-size:22px}
.gt.gd .gp{background:var(--butter)}
.gp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gn{font-size:12px;font-weight:700;padding:5px 7px 6px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{background:var(--card);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .btn{margin-top:10px}
.done-c{border:2.5px solid var(--butter)}
.dtag{display:inline-block;font-size:11.5px;font-weight:700;background:var(--olive);color:var(--butter);border-radius:8px;padding:1px 8px}
.note{font-family:var(--f-hand);font-size:19px;color:var(--olive);line-height:1.3}
.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}
.mo{border:0;background:var(--bg);border-radius:9px;padding:5px 0 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.mo b{font-size:11.5px;color:var(--muted);font-weight:700}
.mo span{font-size:12.5px;letter-spacing:-1.5px;color:var(--olive)}
.mo.now{background:var(--butter)}
.mo.now b{color:var(--ink)}
.dream-h{font-family:var(--f-title);font-weight:700;font-size:16px;margin-bottom:4px}
.wk{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,minmax(26px,32px));gap:4px;align-items:center;font-size:12.5px}
.wk .d{text-align:center;color:var(--muted);font-weight:700;font-size:12px}
.wk .d.today{color:var(--olive);text-decoration:underline}
.ck{width:100%;aspect-ratio:1;border-radius:8px;border:1.5px solid var(--olive);background:#fff;padding:0;font-size:14px;font-weight:700;color:var(--ink)}
.ck.on{background:var(--butter)}
.wkn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wkn button{width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:18px}
.wkn b{font-size:14px}
.swl{font-size:12.5px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.swl i{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:0 5px;margin-right:4px}
.swl i.dr{background:#FBE3DA;color:var(--alert)}
.swl i.ad{background:var(--mist);color:var(--olive)}
.bk{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bk .n{width:22px;font-size:12px;color:var(--muted);text-align:right;flex:none}
.bk .c{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--olive);background:#fff;flex:none;padding:0;font-weight:700}
.bk.on .c{background:var(--butter)}
.bk.on input{text-decoration:line-through;color:var(--muted)}
.bk input{flex:1;min-width:0}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--olive)}
footer a{color:var(--olive);font-weight:700}
.notice{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.a2{background:var(--butter);border-radius:14px;padding:12px 14px;margin:6px 0 10px;font-size:13.5px}.a2 b{color:var(--ink)}.a2 p{margin:8px 0;line-height:1.5}
.a2s{background:#fff;border-radius:10px;padding:8px 10px;margin-top:8px;opacity:.85}.a2s.me{opacity:1;box-shadow:0 0 0 2px var(--olive)}.a2t{font-weight:700;color:var(--olive);font-size:13px}.a2s ol{margin:4px 0 0;padding-left:20px;line-height:1.55}.a2s small{color:var(--muted)}
.a2w{background:#fff;border:1.5px solid var(--alert);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.5}.a2w .btn{margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>
<div class="wrap">
  <div class="top"><p class="hand"><a class="home" href="https://luafit.kr/" target="_blank" rel="noopener" aria-label="루아핏 홈으로">← <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M12 21V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 15C7 15 4.5 11.5 5 8c4.5 0 7 3 7 7z" fill="currentColor" opacity=".75"/><path d="M12 12c0-5 3-8 7.5-8 0 5-3 8-7.5 8z" fill="currentColor"/></svg>LUAFIT</a> 2027</p><h1>2027 비전보드</h1></div>
  <nav class="tabs" id="tabs" aria-label="탭"></nav>
  <div id="a2hs"></div>
  <div id="note"></div>
  <main id="view"></main>
  <div id="sheet"></div>
  <footer>만든이 루아쌤 · <a href="https://www.instagram.com/luafit_healthylife/" target="_blank" rel="noopener">인스타그램</a> · <a href="https://luafit.kr/">루아핏 홈페이지</a><br><a href="#" data-a2open="1">홈 화면에 추가하는 법</a></footer>
</div>
<script>
const MODE="share";
const LSKEY="luafit-vision-2027";
const CATS=[["do","하고 싶은 것"],["have","갖고 싶은 것"],["learn","배우고 싶은 것"],["achieve","이루고 싶은 것"]];
const CATN=Object.fromEntries(CATS);
const TABS=[["vision","비전보드"],["list","리스트"],["act","행동"],["star","별점"],["me","2027"],["done","이룬"]];
const DAY=["일","월","화","수","목","금","토"];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const md=s=>{const d=pd(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일"};
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}

function blank(){return {dreams:[],bucket:Array.from({length:12},()=>({text:"",done:false})),slogan:"",word:"",core:"",goals:["","",""],sw:[{drop:"",add:""},{drop:"",add:""},{drop:"",add:""}],checks:{},weekly:{},give:"",letgo:"",be:[],actions:[]}}
function norm(x){const b=blank();x=x&&typeof x==="object"?x:{};const o=Object.assign(b,x);
  o.dreams=Array.isArray(o.dreams)?o.dreams.map(d=>Object.assign({id:uid(),cat:"do",text:"",photo:null,real:null,pos:{x:50,y:50},rpos:{x:50,y:50},done:false,doneDate:"",note:""},d)):[];
  o.actions=Array.isArray(o.actions)?o.actions.map(a=>Object.assign({id:uid(),text:"",stars:{},dreams:[]},a,{dreams:Array.isArray(a.dreams)?a.dreams.slice():[]})):[];
  o.dreams.forEach(d=>{if(Array.isArray(d.actions))d.actions.forEach(a=>{const ex=o.actions.find(x=>x.id===a.id)||o.actions.find(x=>x.text.trim()&&x.text.trim()===String(a.text||"").trim());if(ex){if(!ex.dreams.includes(d.id))ex.dreams.push(d.id)}else o.actions.push({id:a.id||uid(),text:a.text||"",stars:a.stars||{},dreams:[d.id]})});delete d.actions});
  const ids=new Set(o.dreams.map(d=>d.id));o.actions.forEach(a=>a.dreams=a.dreams.filter(x=>ids.has(x)));o.actions=o.actions.filter(a=>a.dreams.length);
  while(o.bucket.length<12)o.bucket.push({text:"",done:false});o.bucket=o.bucket.slice(0,12);
  while(o.goals.length<3)o.goals.push("");while(o.sw.length<3)o.sw.push({drop:"",add:""});
  o.checks=o.checks||{};o.weekly=o.weekly||{};o.be=Array.isArray(o.be)?o.be.map(b=>Object.assign({id:uid(),text:"",stars:{}},b)):[];
  return o}

const UIKEY="luafit-vision-ui";
let UI={view:"grid",size:3};try{const u=JSON.parse(localStorage.getItem(UIKEY)||"null");if(u&&["grid","swipe"].includes(u.view))UI.view=u.view;if(u&&[1,2,3,4,5].includes(u.size))UI.size=u.size}catch(e){}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify(UI))}catch(e){}}
let focusCard=null;
let S=blank(),tab="vision",week=monday(today()),db=null,assets=null,ready=false,failed=false,dirty=false,saving=false,again=false,pendingRender=false,slow=false;

/* ---------- storage ---------- */
let timer=null,warned=false;
function save(){dirty=true;clearTimeout(timer);timer=setTimeout(flush,500)}
async function flush(){
  if(MODE==="share"){const js=JSON.stringify(S);try{localStorage.setItem(LSKEY,js);dirty=false;if(js.length>4000000&&!warned){warned=true;toast("저장 공간이 거의 찼어요. 안 쓰는 사진을 정리해 주세요")}}catch(e){toast("저장 공간이 꽉 찼어요. 사진을 몇 장 지워 주세요")}return}
  if(!db){return}
  if(saving){again=true;return}
  saving=true;
  try{await db.doc("board/main").set(JSON.parse(JSON.stringify(S)));dirty=false}catch(e){toast("저장하지 못했어요. 잠시 후 다시 해 주세요")}
  saving=false;if(again){again=false;flush()}
}
async function boot(){
  renderAll();
  if(MODE==="share"){
    try{S=norm(JSON.parse(localStorage.getItem(LSKEY)||"null"))}catch(e){S=blank()}
    ready=true;renderAll();return;
  }
  const t=setTimeout(()=>{slow=true;if(!ready)renderAll()},10000);
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){clearTimeout(t);failed=true;renderAll();return}
  try{assets=await claude.use("assets")}catch(e){assets=null}
  db.collection("board").onSnapshot(s=>{
    clearTimeout(t);
    let d=null;try{const x=(s.docs||[]).find(y=>y.id==="main");d=x?x.data():null}catch(e){}
    if(!dirty&&!saving)S=norm(d);
    ready=true;
    const a=document.activeElement;
    if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))pendingRender=true;else renderAll();
  },()=>{clearTimeout(t);failed=true;renderAll()});
}

/* ---------- photos ---------- */
function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    if(MODE==="share")res(c.toDataURL("image/jpeg",q));else c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",q)};
  img.onerror=()=>rej(new Error("img"));img.src=u})}
const src=p=>!p?"":p.src?p.src:p.url?p.url:p.id?"/_blob/"+p.id:"";
async function setPhoto(id,kind,file){
  const d=S.dreams.find(x=>x.id===id);if(!d||!file)return;
  if(MODE!=="share"&&!assets){toast("이 화면에서는 사진을 올릴 수 없어요");return}
  toast("사진을 넣는 중이에요…");
  try{
    let p;
    if(MODE==="share"){p={src:await shrink(file,720,.7)}}
    else{const b=await shrink(file,1400,.85);const r=await assets.upload(new File([b],"photo.jpg",{type:"image/jpeg"}));p={id:r.id,url:r.url}}
    const prev=d[kind];d[kind]=p;d[kind==="real"?"rpos":"pos"]={x:50,y:50};save();renderAll();toast("사진을 넣었어요");
    if(prev&&prev.id&&assets&&assets.delete)assets.delete(prev.id).catch(()=>{});
  }catch(e){toast("사진을 넣지 못했어요. 다른 사진으로 해 보세요")}
}

  if(!force&&(off||sa)){el.innerHTML="";return}
  const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/i.test(ua),and=/Android/i.test(ua),kakao=/KAKAOTALK/i.test(ua),inapp=/KAKAOTALK|Instagram|FBAN|FBAV|NAVER\(inapp|Line\//i.test(ua);
  el.innerHTML=`<div class="a2"><b>📱 내 폰 앱으로 만들기</b>
  ${inapp?`<div class="a2w"><b>먼저 사파리·크롬으로 열어 주세요</b><br>지금은 ${kakao?"카톡":"인스타"} 안에서 보고 있어요. 여기서 적은 기록은 따로 저장돼서 나중에 못 찾을 수 있어요.<br>${kakao?`<button class="btn sm" data-ext="1">사파리·크롬으로 열기</button>`:`오른쪽 위 <b>⋯</b> → <b>외부 브라우저에서 열기</b>(아이폰은 "Safari에서 열기")`}</div>`:""}
  <div class="a2s ${ios?"me":""}"><span class="a2t">아이폰</span><ol><li><b>사파리</b>로 이 페이지 열기</li><li>아래쪽 <b>공유 버튼(□↑)</b> 누르기<br><small>버튼이 안 보이면 화면을 살짝 위로 올리거나 주소창 옆 <b>⋯</b> → 공유</small></li><li>메뉴를 내려 <b>홈 화면에 추가</b> → 오른쪽 위 <b>추가</b></li></ol></div>
  <div class="a2s ${and?"me":""}"><span class="a2t">안드로이드 (갤럭시 등)</span><ol><li><b>크롬</b>으로 이 페이지 열기<br><small>삼성 인터넷은 아래 <b>≡</b> → <b>현재 페이지 추가</b> → 홈 화면</small></li><li>오른쪽 위 <b>⋮</b> 누르기</li><li><b>홈 화면에 추가</b> (또는 <b>앱 설치</b>) → <b>추가</b></li></ol></div>
  <p>홈 화면에 생긴 <b>비전보드</b> 아이콘으로 들어오면 앱처럼 열려요. 기록은 이 폰에만 저장되니, 폰을 바꾸기 전엔 '2027' 탭 맨 아래에서 백업해 주세요.</p>
  <button class="btn sub sm" data-a2close="1">알겠어요</button></div>`}
document.addEventListener("click",e=>{if(e.target.closest("[data-ext]")){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(location.href.split("#")[0]);return}if(e.target.closest("[data-a2open]")){e.preventDefault();a2hs(true);window.scrollTo(0,0)}});
document.addEventListener("click",e=>{if(e.target.closest("[data-a2close]")){try{localStorage.setItem(A2KEY,"1")}catch(er){}a2hs()}});
function go(t){tab=t;try{history.replaceState(null,"","#"+t)}catch(e){location.hash=t}renderAll();window.scrollTo(0,0)}

/* ---------- edits ---------- */
function setField(key,v){
  const p=key.split("|");
  if(p[0]==="dream"){const d=S.dreams.find(x=>x.id===p[1]);if(d)d.text=v}
  else if(p[0]==="act"){const a=S.actions.find(x=>x.id===p[1]);if(a)a.text=v}
  else if(p[0]==="bucket")S.bucket[+p[1]].text=v;
  else if(p[0]==="goal")S.goals[+p[1]]=v;
  else if(p[0]==="sw")S.sw[+p[1]][p[2]]=v;
  else if(p[0]==="wk"){S.weekly[p[1]]=Object.assign({},S.weekly[p[1]],{[p[2]]:v})}
  else if(p[0]==="be"){const b=S.be.find(x=>x.id===p[1]);if(b)b.text=v}
  else if(p[0]==="note"){const d=S.dreams.find(x=>x.id===p[1]);if(d)d.note=v}
  else if(p[0]==="dd"){const d=S.dreams.find(x=>x.id===p[1]);if(d&&v)d.doneDate=v}
  else if(["slogan","word","core","give","letgo"].includes(p[0]))S[p[0]]=v;
  save();
}
function add(key){
  const p=key.split("|");
  const el=p[0]==="dream"?$("#add-"+p[1]):p[0]==="act"?$("#add-act-"+p[1]):$("#add-be");
  const v=el&&el.value.trim();if(!v)return;
  if(p[0]==="dream")S.dreams.push({id:uid(),cat:p[1],text:v,photo:null,real:null,pos:{x:50,y:50},rpos:{x:50,y:50},done:false,doneDate:"",note:""});
  else if(p[0]==="act"){const ex=S.actions.find(x=>x.text.trim()===v);if(ex){if(!ex.dreams.includes(p[1]))ex.dreams.push(p[1])}else S.actions.push({id:uid(),text:v,stars:{},dreams:[p[1]]})}
  else S.be.push({id:uid(),text:v,stars:{}});
  save();renderAll();const n=p[0]==="dream"?$("#add-"+p[1]):p[0]==="act"?$("#add-act-"+p[1]):$("#add-be");if(n)n.focus();
}
function del(key){
  const p=key.split("|");
  if(p[0]==="dream"){const d=S.dreams.find(x=>x.id===p[1]);S.dreams=S.dreams.filter(x=>x.id!==p[1]);S.actions.forEach(a=>a.dreams=a.dreams.filter(x=>x!==p[1]));S.actions=S.actions.filter(a=>a.dreams.length);if(d&&assets&&assets.delete)[d.photo,d.real].forEach(x=>{if(x&&x.id)assets.delete(x.id).catch(()=>{})})}
  else if(p[0]==="act"){const a=S.actions.find(x=>x.id===p[2]);if(a){a.dreams=a.dreams.filter(x=>x!==p[1]);if(!a.dreams.length)S.actions=S.actions.filter(x=>x!==a)}}
  else if(p[0]==="be")S.be=S.be.filter(x=>x.id!==p[1]);
  save();renderAll();toast("지웠어요");
}
function arm(el,label,fn){if(el.dataset.armed){fn();return}el.dataset.armed="1";const old=el.textContent;el.textContent=label;el.classList.add("armed");setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=old;el.classList.remove("armed")}},3000)}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){go(t.dataset.tab);return}
  const vw=e.target.closest("[data-view]");if(vw){UI.view=vw.dataset.view;saveUI();renderAll();return}
  const sz=e.target.closest("[data-size]");if(sz){UI.size=+sz.dataset.size;saveUI();renderAll();return}

  const shc=e.target.closest("[data-shclose]");if(shc&&(e.target===shc||shc.tagName==="BUTTON")){sheet=null;renderAll();return}
  if(MODE!=="share"&&(!ready||!db))return;
  const ed=e.target.closest("[data-edit]");if(ed){sheet=ed.dataset.edit;renderAll();return}
  const fl=e.target.closest("[data-flip]");if(fl){const id=fl.dataset.flip;if(flipped.has(id))flipped.delete(id);else flipped.add(id);fl.classList.toggle("flip");return}
  const lk=e.target.closest("[data-link]");if(lk){const[did,aid]=lk.dataset.link.split("|");const a=S.actions.find(x=>x.id===aid);if(a&&!a.dreams.includes(did)){a.dreams.push(did);save();renderAll();toast("행동을 연결했어요")}return}
  const cb=e.target.closest("[data-cat]");if(cb){const[id,c]=cb.dataset.cat.split("|");const d=S.dreams.find(x=>x.id===id);if(d){d.cat=c;save();renderAll()}return}
  const rc=e.target.closest("[data-recenter]");if(rc){const[id,k]=rc.dataset.recenter.split("|");const d=S.dreams.find(x=>x.id===id);if(d){d[k]={x:50,y:50};save();renderAll()}return}
  const ac=e.target.closest("[data-achieve]");if(ac){const d=S.dreams.find(x=>x.id===ac.dataset.achieve);if(d){d.done=true;d.doneDate=today();sheet=null;save();toast("축하해요! 이룬 탭으로 옮겼어요");go("done")}return}
  const un=e.target.closest("[data-undo]");if(un){arm(un,"한 번 더 누르면 되돌려요",()=>{const d=S.dreams.find(x=>x.id===un.dataset.undo);if(d){d.done=false;sheet=null;save();renderAll();toast("비전보드로 되돌렸어요")}});return}
  const ad=e.target.closest("[data-add]");if(ad){add(ad.dataset.add);return}
  const dl=e.target.closest("[data-del]");if(dl){arm(dl,"한 번 더",()=>del(dl.dataset.del));return}
  const st=e.target.closest("[data-star]");if(st){const[k,m]=st.dataset.star.split(/\|(?=\d+$)/);const p=k.split("|");let o=null;
    if(p[0]==="act")o=S.actions.find(x=>x.id===p[1]);else o=S.be.find(x=>x.id===p[1]);
    if(o){o.stars=Object.assign({},o.stars);const v=((o.stars[m]||0)+1)%6;if(v)o.stars[m]=v;else delete o.stars[m];save();const sp=st.querySelector("span");if(sp)sp.textContent=v?stars(v):"·";st.setAttribute("aria-label",m+"월 별 "+v+"개")}return}
  const bk=e.target.closest("[data-bk]");if(bk){const b=S.bucket[+bk.dataset.bk];b.done=!b.done;save();renderAll();return}
  const ck=e.target.closest("[data-ck]");if(ck){const k=ck.dataset.ck;if(S.checks[k])delete S.checks[k];else S.checks[k]=true;save();const on=!!S.checks[k];ck.classList.toggle("on",on);ck.textContent=on?"✓":"";ck.setAttribute("aria-pressed",on);return}
  const wk=e.target.closest("[data-wk]");if(wk){week=addD(week,7*(+wk.dataset.wk));renderAll();return}
  const bu=e.target.closest("[data-backup]");if(bu){
    if(bu.dataset.backup==="copy"){const lite=JSON.parse(JSON.stringify(S));lite.dreams.forEach(d=>{d.photo=null;d.real=null});const code="LUAFIT2027:"+btoa(unescape(encodeURIComponent(JSON.stringify(lite))));
      (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast("백업 코드를 복사했어요. 메모장에 붙여 두세요")).catch(()=>{const ta=$("#bk-in");if(ta){ta.value=code;ta.select()}toast("복사가 안 돼서 아래 칸에 넣었어요. 직접 복사해 주세요")})}
    else{const ta=$("#bk-in"),raw=(ta&&ta.value||"").trim();if(!raw.startsWith("LUAFIT2027:")){toast("백업 코드가 맞는지 확인해 주세요");return}
      arm(bu,"지금 기록을 덮어써요. 한 번 더",()=>{try{const o=norm(JSON.parse(decodeURIComponent(escape(atob(raw.slice(11))))));const keep={};S.dreams.forEach(d=>keep[d.id]=d);o.dreams.forEach(d=>{const k=keep[d.id];if(k){d.photo=k.photo;d.real=k.real}});S=o;save();renderAll();toast("불러왔어요")}catch(er){toast("백업 코드를 읽지 못했어요")}})}
    return}
});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.sizer){UI.size=+el.value;saveUI();const g=document.querySelector(".gg");if(g)g.style.gridTemplateColumns="repeat("+UI.size+",minmax(0,1fr))"}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.photo){const[id,k]=el.dataset.photo.split("|");if(MODE!=="share"&&(!ready||!db))return;setPhoto(id,k,el.files&&el.files[0]);el.value="";return}
  if(el.dataset.f){if(MODE!=="share"&&(!ready||!db))return;setField(el.dataset.f,el.type==="date"?el.value:el.value.trim());if(el.dataset.f.startsWith("dd|"))renderAll()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet){sheet=null;renderAll();return}if(e.key!=="Enter"||e.isComposing)return;const el=e.target;if(el.dataset&&el.dataset.flip){el.click();return}if(el.dataset&&el.dataset.enter){e.preventDefault();add(el.dataset.enter)}else if(el.tagName==="INPUT"&&el.dataset.f)el.blur()});
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(pendingRender&&!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))renderAll()},120));
(function(){let st=null;
  document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-drag]");if(!el)return;const[id,k]=el.dataset.drag.split("|");const d=S.dreams.find(x=>x.id===id);if(!d)return;
    e.preventDefault();const r=el.getBoundingClientRect();st={d,k,x:e.clientX,y:e.clientY,w:r.width,h:r.height,p:Object.assign({x:50,y:50},d[k]),img:el.querySelector("img"),pid:e.pointerId};try{el.setPointerCapture(e.pointerId)}catch(er){}});
  document.addEventListener("pointermove",e=>{if(!st||e.pointerId!==st.pid)return;const nx=Math.max(0,Math.min(100,st.p.x-(e.clientX-st.x)/st.w*150)),ny=Math.max(0,Math.min(100,st.p.y-(e.clientY-st.y)/st.h*150));st.n={x:Math.round(nx),y:Math.round(ny)};if(st.img)st.img.style.objectPosition=st.n.x+"% "+st.n.y+"%"});
  const end=e=>{if(!st||e.pointerId!==st.pid)return;if(st.n){st.d[st.k]=st.n;save()}st=null};
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
})();
let noClick=0;
document.addEventListener("click",e=>{if(Date.now()-noClick<450&&e.target.closest("[data-flip]")){e.stopPropagation();e.preventDefault()}},true);
(function(){let st=null,tm=null,gh=null,on=false,hot=null;
  const clear=()=>{clearTimeout(tm);tm=null;if(gh)gh.remove();gh=null;document.querySelectorAll(".ft.lift,.ft.hot").forEach(x=>x.classList.remove("lift","hot"));on=false;hot=null;st=null};
  document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-flip]");if(!el||e.target.closest("[data-edit]"))return;if(MODE!=="share"&&(!ready||!db))return;
    clear();st={id:el.dataset.flip,el,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pid:e.pointerId};
    tm=setTimeout(()=>{if(!st)return;on=true;st.el.classList.add("lift");gh=document.createElement("div");gh.className="ghost";const im=st.el.querySelector(".ff img");gh.innerHTML=im?`<img src="${im.src}" style="${im.getAttribute("style")||""}">`:esc((S.dreams.find(d=>d.id===st.id)||{}).text||"");document.body.appendChild(gh);gh.style.left=st.x+"px";gh.style.top=st.y+"px";try{navigator.vibrate&&navigator.vibrate(15)}catch(er){}},450)});
  document.addEventListener("pointermove",e=>{if(!st||e.pointerId!==st.pid)return;st.x=e.clientX;st.y=e.clientY;
    if(!on){if(Math.hypot(st.x-st.sx,st.y-st.sy)>10){clearTimeout(tm);st=null}return}
    e.preventDefault();gh.style.left=st.x+"px";gh.style.top=st.y+"px";
    const under=document.elementFromPoint(st.x,st.y),t=under&&under.closest("[data-flip]");if(hot&&hot!==t)hot.classList.remove("hot");hot=t&&t!==st.el?t:null;if(hot)hot.classList.add("hot")});
  document.addEventListener("touchmove",e=>{if(on)e.preventDefault()},{passive:false});
  document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("[data-flip]"))e.preventDefault()});
  const end=e=>{if(!st||(e.pointerId!=null&&e.pointerId!==st.pid))return;
    if(!on){clearTimeout(tm);st=null;return}
    const from=st.id,to=hot&&hot.dataset.flip;noClick=Date.now();clear();
    if(to&&to!==from){const a=S.dreams,fi=a.findIndex(d=>d.id===from),ti=a.findIndex(d=>d.id===to);const[m]=a.splice(fi,1);a.splice(ti,0,m);save();renderAll();toast("자리를 옮겼어요")}};
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
})();
window.addEventListener("pagehide",()=>{if(dirty)flush()});
const h0=(location.hash||"").slice(1);if(VIEWS[h0])tab=h0;
a2hs();
boot();
</script>
